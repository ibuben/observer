[package]
name = "xm-nvr"
version = "1.1.0"
edition = "2021"
autobins = false
description = "eXUnity Observer — клиент регистраторов Xiongmai по локальному или белому IP"

[dependencies]
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
eframe = "0.31"
egui-phosphor = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[lib]
name = "xm_nvr"
path = "src/lib.rs"

[[bin]]
name = "xm-view"
path = "src/bin/xm-view.rs"

[[bin]]
name = "xm-nvr"
path = "src/bin/xm-nvr.rs"

[build-dependencies]
embed-resource = "3.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[target."cfg(not(windows))".dependencies]
cpal = "0.18.2"
